version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      # One catch-all group: every update type, prod and dev, lands in a single PR
      # per cycle. The previous split (dev minor+patch / prod patch) left production
      # minors and all majors ungrouped, and each of those became its own PR --
      # that was the actual source of the PR flood, not the weekly cadence.
      all-dependencies:
        patterns: ["*"]
    ignore:
      # The eslint / eslint-config-airbnb-base pins that used to live here are gone:
      # Phase 1a dropped airbnb-base entirely in favour of flat-config eslint 10, so
      # eslint majors are free to flow again.
      #
      # joi is the constrained one now. express-validation 4 declares a peer of
      # joi ^17.6.0, so a bump to joi 18 reintroduces exactly the class of `npm ci`
      # peer conflict this repo was just rescued from -- Dependabot already proved
      # that by merging express-validation 4.1.1 alongside joi 18.2.3 in PR #78.
      # Revisit if express-validation ships joi 18 support, or if the validation
      # layer is replaced with a hand-rolled joi middleware.
      - dependency-name: "joi"
        update-types: ["version-update:semver-major"]

  # Valid as of Phase 1a: .github/workflows/ci.yml now exists. Declaring this ecosystem
  # with no workflows directory is what made Dependabot error on every run.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
