version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      production-patches:
        dependency-type: "production"
        update-types: ["patch"]
    ignore:
      # The eslint / eslint-config-airbnb-base pins that used to live here are gone:
      # Phase 1a dropped airbnb-base entirely for flat-config eslint 10, so eslint
      # majors are free to flow again.
      #
      # joi is now the constrained one. express-validation 4 declares a peer of
      # joi ^17.6.0, so a bump to joi 18 reintroduces exactly the class of
      # `npm ci` peer conflict this repo was just rescued from. Revisit if
      # express-validation ships joi 18 support, or if the validation layer is
      # replaced with a hand-rolled joi middleware.
      - dependency-name: "joi"
        update-types: ["version-update:semver-major"]

# NOTE: no "github-actions" ecosystem block here on purpose. Dependabot errors on every
# run if that ecosystem is declared while the repo has no .github/workflows/ directory.
